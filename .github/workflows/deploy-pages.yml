name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Recent runs of this job: 182s, 191s, 207s, 223s. GitHub's default is 360
    # MINUTES, so without this a hung browser or a wedged install burns a runner
    # for six hours and reports nothing -- a stuck job, not a failure, which is
    # the harder signal to read because it invites a re-run instead of a look.
    # 15 is ~4x the slowest measured run.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
        # if package.json has drifted from it, so a bump that edits one and not
        # the other goes red here instead of being silently resolved into a build
        # nobody can reproduce. This file used `npm ci` until 9315ff7 (2026-04-12,
        # "fix: use npm install in pages workflow") switched it with no reason
        # recorded. Both candidate reasons were checked against that commit and
        # neither held: package.json and the lock were in sync at its parent, and
        # the lockfile is version 3, which records optional deps for every
        # platform -- so it was not the macOS-lockfile-misses-Linux-binaries trap.
        # If this ever fails on the runner and not locally, the fix is to
        # regenerate the lockfile, not to go back to `npm install`.
        run: npm ci

      - name: Verify ciphers against official test vectors
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E + accessibility gate (WCAG A/AA, axe-core)
        run: npm run test:a11y

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own tests, build and axe/e2e run went green on the PR.
  #
  # EVERY bump merges that way, MAJORS INCLUDED.
  # This job filters on author, not bump type.
  # Read the `if:` below: it tests the event and the actor and nothing else, and
  # nothing anywhere in this repo reads a bump's update-type. That is deliberate: the gate (unit tests, build, axe WCAG and
  # the e2e claims) judges a bump far better than its version number does, and a
  # major that actually breaks this lab fails the gate and stays open for a
  # human. Evidence rather than intent: PR #16 (vitest 4 -> 5) was merged here
  # by github-actions with nobody involved, and the suite came out of it at the
  # same count it went in with.
  #
  # Two readings this used to invite, both wrong. Majors are NOT held back for
  # review, and they are NOT excluded from this job. The narrower thing that is
  # true of them lives in dependabot.yml: they are not GROUPED with the routine
  # bumps, because one breaking major makes a grouped PR unmergeable. Grouping
  # and merging are separate decisions, and these comments conflated them --
  # this header asserted "majors are deliberately excluded" fourteen lines above
  # a step whose own comment said "majors included on purpose".
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Three gh calls and at most two 15s sleeps.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      # No metadata step. This job carried `dependabot/fetch-metadata@v3` under
      # `id: meta` whose outputs nothing ever read -- inert, but an `id:` on a
      # metadata action reads as a version gate that must be wired up somewhere
      # below, which is most of how the false "majors are excluded" prose above
      # survived as long as it did. If a real update-type rule is ever wanted,
      # add the step back AND branch on it, and fix the comments in the same
      # commit so the two cannot drift apart again.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy-pages.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
